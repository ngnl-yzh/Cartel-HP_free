{% extends "base.html" %}
{% block title %}글 수정 · {{ board_name }} · 공모전 보드{% endblock %}

{% block content %}
<main class="board-page">
  <div class="container" style="max-width:780px">
    <div class="page-heading" style="margin-bottom:1.5rem">
      <div>
        <p class="eyebrow">{{ board_name }}</p>
        <h1>글 수정</h1>
      </div>
      <a href="/board/{{ board }}/post/{{ post.id }}" class="btn btn-outline">취소</a>
    </div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/board/{{ board }}/post/{{ post.id }}/edit" class="post-form">
      <label class="field">
        <span>제목 <span class="required">*</span></span>
        <input type="text" name="title" required maxlength="200"
               value="{{ post.title | e }}" autofocus>
      </label>

      <label class="field">
        <span>내용</span>
        <textarea name="content" id="postContent" rows="14"
                  placeholder="내용을 입력하세요. 마크다운과 @활동명 멘션을 지원합니다.">{{ post.content | e }}</textarea>
      </label>

      <div class="preview-block">
        <div class="preview-head">미리보기</div>
        <div id="postPreview" class="markdown-body"></div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">수정 완료</button>
        <a href="/board/{{ board }}/post/{{ post.id }}" class="btn btn-outline">취소</a>
      </div>
    </form>
  </div>
</main>
{% endblock %}

{% block scripts %}
<script>
const content = document.getElementById("postContent");
const preview = document.getElementById("postPreview");
if (content && preview) {
  const update = () => { preview.innerHTML = renderMentions(renderMarkdown(content.value)); };
  content.addEventListener("input", update);
  update();
}
</script>
{% endblock %}
